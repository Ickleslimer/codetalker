name: publish

# Publishes codetalker-mcp to PyPI when a vX.Y.Z tag is pushed (or manually
# via workflow_dispatch), then cuts the matching GitHub release with notes
# SOURCED LIVE from the PyPI JSON API — so the release page and the PyPI
# project description stay paired by construction, not by hand-copying.
#
# Gate: the wheel must pass the stranger-install smoke (fresh venv,
# non-editable install, handshake, empty-home probe) before anything uploads.
#
# Auth: PyPI Trusted Publishing (OIDC) — no API tokens stored in the repo.
# One-time prerequisite (repo owner): on pypi.org, under
# project/codetalker-mcp/manage/publishing, register a pending publisher:
#   owner=Ickleslimer  repo=codetalker  workflow=publish.yml
#   environment=pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Read version + tag/version consistency guard
        id: version
        run: |
          VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' src/codetalker/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "__version__=$VERSION ref=$GITHUB_REF"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF_NAME#v}
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag v$TAG does not match __version__ $VERSION"
              exit 1
            fi
          fi

      - name: Build sdist + wheel
        run: uv build --out-dir dist

      - name: Wheel smoke gate (fresh venv, non-editable install)
        run: |
          uv venv .smoke-venv --python 3.12
          WHEEL=$(ls dist/*.whl)
          uv pip install --python .smoke-venv/bin/python "$WHEEL"
          .smoke-venv/bin/python scripts/stranger_smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Runs only after a successful PyPI upload; creates the matching GitHub
    # release with notes fetched live from the PyPI registry.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Wait for the new version to be live on PyPI, then fetch its description
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Poll the VERSION-SPECIFIC endpoint, not the aggregate one. PyPI's CDN
          # serves /pypi/<dist>/<version>/json within seconds of upload, while the
          # top-level "latest" pointer and the /simple/ index can lag by many
          # minutes (seen live on the v0.3.9 release, 2026-09-28: this gate failed
          # twice on a healthy upload confirmed with 200 OK). curl --retry absorbs
          # transient 5xx/429s; the loop bounds the total wait at ~20 minutes so a
          # genuinely failed upload still fails loudly.
          try_fetch() {
            curl -sfL --retry 3 --retry-delay 3 --max-time 20 \
              "https://pypi.org/pypi/codetalker-mcp/${VERSION}/json" \
              | python3 -c "import json,sys; info=json.load(sys.stdin)['info']; open('pypi-description.md','w',encoding='utf-8').write(info['description']); print(info['version'])"
          }
          for i in $(seq 1 20); do
            rm -f pypi-description.md
            LIVE=$(try_fetch 2>/dev/null | tail -1)
            echo "attempt $i: PyPI serves version=${LIVE:-<none>} (want $VERSION)"
            if [ "$LIVE" = "$VERSION" ] && [ -s pypi-description.md ]; then
              echo "description bytes: $(wc -c < pypi-description.md)"
              break
            fi
            if [ "$i" = "20" ]; then
              echo "::error::PyPI still does not serve $VERSION after 20 minutes — not cutting a release with unpaired notes"
              exit 1
            fi
            sleep 60
          done

      - name: Assemble paired release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Quoted heredoc ('PYEOF'): bash performs NO substitution, so plain
          # backticks are safe inside the Python; VERSION arrives via env.
          python3 - <<'PYEOF'
          import os

          version = os.environ["VERSION"]
          header = (
              "> **Release of the PyPI publication: [`codetalker-mcp "
              + version
              + "`](https://pypi.org/project/codetalker-mcp/)** —\n"
              "> built and published by the [`publish.yml`]"
              "(https://github.com/Ickleslimer/codetalker/blob/main/.github/workflows/publish.yml)\n"
              "> workflow via PyPI trusted publishing, gated on the stranger-install smoke.\n"
              ">\n"
              "> These notes are the live PyPI project description, fetched from the registry\n"
              "> at release time so this page and PyPI stay paired.\n"
              "\n"
              "---\n"
              "\n"
          )
          desc = open("pypi-description.md", encoding="utf-8").read()
          open("release-notes.md", "w", encoding="utf-8").write(header + desc)
          PYEOF

      - name: Create the GitHub release (skip if it already exists)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION} — codetalker-mcp on PyPI" \
            --notes-file release-notes.md
